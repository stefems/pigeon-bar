name: Snapshot Google Sheet into JSON fallback

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC (~3 am Denver)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/snapshot-sheet.mjs
        env:
          SHEET_SOURCE: live
      - name: Commit if changed
        run: |
          git config user.name "sheet-snapshot[bot]"
          git config user.email "sheet-snapshot@users.noreply.github.com"
          git add src/content/*.json
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Snapshot Google Sheet content"
            git push
          fi
